name: Push to GHCR
on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      registry-path: ${{ steps.push.outputs.registry-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trunkver
        id: trunkver
        uses: crftd-tech/trunkver@main

      - name: Docker Metadata
        id: docker-metadata
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge
            type=semver,value=${{ steps.trunkver.outputs.trunkver }},pattern={{version}}

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          oci: true
          layers: true
          containerfiles: |
            ./Containerfile
          extra-args: |
            --cache-from=${{ env.IMAGE_REGISTRY }}/${{ github.event.repository.name }}-cache
            --cache-to=${{ env.IMAGE_REGISTRY }}/${{ github.event.repository.name }}-cache

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          tags: ${{ steps.build_image.outputs.tags }}

      - name: Setup cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: "v2.6.0"
      - name: Sign docker image
        run: |
          for tag in $TAGS; do
            cosign sign --yes  $tag
          done
        env:
          TAGS: ${{ steps.build_image.outputs.tags }}


      - name: Echo outputs
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"

  build-iso:
    name: Build and push iso
    runs-on: ubuntu-latest
    needs: [build-image]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Build ISO
        uses: ublue-os/titanoboa@main
        id: build
        with:
          image-ref: ${{ needs.build-image.outputs.registry-path }}

      - name: Rename ISO
        run: |
          mkdir -p output
          mv ${{ steps.build.outputs.iso-dest }} output/custom-image-$(date +%Y%m%d).iso
          (cd output && sha256sum *.iso | tee CHECKSUMS)

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-iso
          path: output/
