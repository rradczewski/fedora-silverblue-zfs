name: Push to GHCR
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write

env:
  ARCH: x86_64
  VARIANT: silverblue
  VERSION: "42"
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_TAG: edge
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trunkver
        id: trunkver
        uses: crftd-tech/trunkver@main

      - name: Docker Metadata
        id: docker-metadata
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge
            type=semver,value=${{ steps.trunkver.outputs.trunkver }},pattern={{version}}

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          oci: true
          layers: true
          containerfiles: |
            ./Containerfile
          extra-args: |
            --cache-from=${{ env.IMAGE_REGISTRY }}/${{ github.event.repository.name }}-cache
            --cache-to=${{ env.IMAGE_REGISTRY }}/${{ github.event.repository.name }}-cache

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          tags: ${{ steps.build_image.outputs.tags }}

      - name: Echo outputs
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"

  build-iso:
    name: Build and push iso
    runs-on: ubuntu-latest
    needs: [build-image]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO
        uses: jasonn3/build-container-installer@main
        id: build
        with:
          arch: ${{ env.ARCH}}
          image_name: ${{ env.IMAGE_NAME}}
          image_repo: ${{ env.IMAGE_REGISTRY }}
          image_tag: ${{ env.IMAGE_TAG }}
          version: ${{ env.VERSION }}
          variant: ${{ env.VARIANT }}
          iso_name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}-${{ env.VERSION }}.iso
          repos: /github/workspace/installer/repos/zfs.repo /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora-updates.repo
          additional_templates: /github/workspace/installer/lorax/zfs-packages-install.tmpl /github/workspace/installer/lorax/zfs-packages-postinstall.tmpl

      # This example is for uploading your ISO as a Github artifact. You can do something similar using any cloud storage, so long as you copy the output
      - name: Upload ISO as artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.iso_name }}
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
